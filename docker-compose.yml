services:
  db:
    image: postgres:16-alpine
    container_name: olist_db
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: olist_app
    profiles: ["pipeline"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db        # service name inside the Docker network
      POSTGRES_PORT: "5432"    # container port, not the host port 5433
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./docs:/app/docs

volumes:
  pgdata: